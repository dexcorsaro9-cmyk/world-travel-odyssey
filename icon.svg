<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sfondo Squircle App Icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Anello esterno d'oro con micro-tacche bussola -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#goldGrad)" stroke-width="8" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="202" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="8 12"/>

  <!-- Globo con meridiani e paralleli -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="3"/>
  <ellipse cx="256" cy="256" rx="140" ry="60" fill="none" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2.5"/>
  <ellipse cx="256" cy="256" rx="60" ry="140" fill="none" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2.5"/>
  <line x1="116" y1="256" x2="396" y2="256" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2.5"/>

  <!-- Rosa dei Venti / Bussola a 8 punte in oro sbalzato -->
  <g filter="url(#glow)">
    <!-- Punte Nord/Sud/Est/Ovest -->
    <polygon points="256,70 268,230 256,256 244,230" fill="url(#goldGrad)"/>
    <polygon points="256,442 268,282 256,256 244,282" fill="url(#goldGrad)"/>
    <polygon points="442,256 282,268 256,256 282,244" fill="url(#goldGrad)"/>
    <polygon points="70,256 230,268 256,256 230,244" fill="url(#goldGrad)"/>

    <!-- Punte Diagonali Minori -->
    <polygon points="380,132 278,236 256,256 270,242" fill="#f59e0b"/>
    <polygon points="132,380 234,276 256,256 242,270" fill="#f59e0b"/>
    <polygon points="380,380 278,276 256,256 270,270" fill="#f59e0b"/>
    <polygon points="132,132 234,236 256,256 242,242" fill="#f59e0b"/>
  </g>

  <!-- Jet di Linea che decolla in ascesa verso l'alto a destra -->
  <g transform="translate(256, 256) rotate(-35) translate(-256, -256)" filter="url(#glow)">
    <path d="M256,120 L276,210 L370,246 L370,274 L276,260 L276,330 L308,358 L308,380 L256,370 L204,380 L204,358 L236,330 L236,260 L142,274 L142,246 L236,210 Z" fill="#ffffff"/>
    <path d="M256,120 L276,210 L256,256 L236,210 Z" fill="#fef08a"/>
  </g>

  <!-- Monogramma Dorato WTO in Basso -->
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="8" filter="url(#glow)">WTO</text>
</svg>
