<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="appBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1548"/>
      <stop offset="45%" stop-color="#0e1126"/>
      <stop offset="85%" stop-color="#050711"/>
      <stop offset="100%" stop-color="#020307"/>
    </radialGradient>

    <linearGradient id="gold24k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffef0"/>
      <stop offset="20%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="90%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="holoCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#67e8f9"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Riflesso di Vetro Speculare -->
    <linearGradient id="glossSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Scia Afterburner -->
    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#00f0ff"/>
      <stop offset="70%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <filter id="bloomGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#appBg)"/>

  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="url(#gold24k)" stroke-width="7" opacity="0.95"/>
  <rect x="18" y="18" width="476" height="476" rx="104" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
  <rect x="24" y="24" width="464" height="464" rx="98" fill="none" stroke="url(#gold24k)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <circle cx="256" cy="246" r="190" fill="radial-gradient(circle, rgba(245, 158, 11, 0.18) 0%, rgba(2, 132, 199, 0.08) 55%, transparent 75%)"/>

  <g filter="url(#bloomGlow)">
    <circle cx="256" cy="246" r="160" fill="#0b1329" stroke="url(#gold24k)" stroke-width="4.5"/>
    
    <ellipse cx="256" cy="246" rx="160" ry="70" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2.2"/>
    <ellipse cx="256" cy="246" rx="70" ry="160" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2.2"/>
    <line x1="96" y1="246" x2="416" y2="246" stroke="rgba(56, 189, 248, 0.5)" stroke-width="2.5"/>
    <line x1="256" y1="86" x2="256" y2="406" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2"/>
    
    <ellipse cx="256" cy="176" rx="138" ry="42" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.8"/>
    <ellipse cx="256" cy="316" rx="138" ry="42" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.8"/>
  </g>

  <g filter="url(#softShadow)">
    <circle cx="256" cy="246" r="128" fill="none" stroke="url(#gold24k)" stroke-width="3"/>
    <circle cx="256" cy="246" r="134" fill="none" stroke="rgba(255, 240, 138, 0.5)" stroke-width="1.2" stroke-dasharray="4 6"/>
    
    <polygon points="256,76 268,234 256,246" fill="url(#goldLight)"/>
    <polygon points="256,76 244,234 256,246" fill="url(#gold24k)"/>
    <polygon points="256,416 268,258 256,246" fill="url(#gold24k)"/>
    <polygon points="256,416 244,258 256,246" fill="url(#goldLight)"/>
    <polygon points="416,246 258,258 246,246" fill="url(#goldLight)"/>
    <polygon points="416,246 258,234 246,246" fill="url(#gold24k)"/>
    <polygon points="96,246 234,258 246,246" fill="url(#gold24k)"/>
    <polygon points="96,246 234,234 246,246" fill="url(#goldLight)"/>

    <polygon points="369,133 266,236 256,246" fill="url(#goldLight)"/>
    <polygon points="369,133 256,246 266,256" fill="url(#gold24k)"/>
    <polygon points="369,359 266,256 256,246" fill="url(#gold24k)"/>
    <polygon points="369,359 256,246 256,256" fill="url(#goldLight)"/>
    <polygon points="143,359 246,256 256,246" fill="url(#goldLight)"/>
    <polygon points="143,359 256,246 246,246" fill="url(#gold24k)"/>
    <polygon points="143,133 246,236 256,246" fill="url(#gold24k)"/>
    <polygon points="143,133 256,246 246,236" fill="url(#goldLight)"/>
  </g>

  <!-- Jet Supersonico Oro & Ciano in Decollo Diagonale (Verso Alto-Destra) -->
  <g transform="translate(256, 246) rotate(45) translate(-256, -246)" filter="url(#softShadow)">
    <!-- Scia di Propulsione Cyan / Fucsia -->
    <path d="M250,330 L262,330 L268,440 L244,440 Z" fill="url(#trailGrad)"/>
    <circle cx="256" cy="334" r="9" fill="#00f0ff" filter="url(#bloomGlow)"/>
    <circle cx="256" cy="334" r="4" fill="#ffffff"/>

    <!-- Ali a Freccia con Bordi Dorati -->
    <path d="M256,120 L380,270 L340,290 L272,270 L276,340 L304,365 L276,365 L256,345 L236,365 L208,365 L236,340 L240,270 L172,290 L132,270 Z" 
          fill="url(#holoCyan)" stroke="url(#gold24k)" stroke-width="2.5"/>

    <!-- Dorso Fusoliera Rifinita in Oro Massiccio 24k -->
    <path d="M256,110 L270,260 L256,340 L242,260 Z" fill="url(#goldLight)" stroke="url(#gold24k)" stroke-width="1.8"/>
    <line x1="256" y1="112" x2="256" y2="338" stroke="#ffffff" stroke-width="1.8"/>

    <!-- Cupolino Olografico Zaffiro -->
    <ellipse cx="256" cy="180" rx="7" ry="18" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <ellipse cx="254.5" cy="174" rx="3" ry="10" fill="#ffffff" opacity="0.9"/>

    <!-- Luci di Posizione Alari -->
    <circle cx="378" cy="270" r="4" fill="#ef4444" filter="url(#bloomGlow)"/>
    <circle cx="134" cy="270" r="4" fill="#22c55e" filter="url(#bloomGlow)"/>
  </g>

  <!-- Brillantini e Stelle Auree -->
  <g fill="#fef08a" filter="url(#bloomGlow)">
    <polygon points="395,95 400,110 415,115 400,120 395,135 390,120 375,115 390,110"/>
    <polygon points="105,375 109,387 121,391 109,395 105,407 101,395 89,391 101,387" transform="scale(0.8) translate(20, 80)"/>
    <polygon points="340,390 343,398 351,401 343,404 340,412 337,404 329,401 337,398"/>
    <circle cx="130" cy="155" r="3.5" fill="#38bdf8"/>
    <circle cx="380" cy="220" r="2.8" fill="#ffffff"/>
  </g>

  <!-- Riflesso Vetro Curvo Trasparente -->
  <path d="M22,120 C70,45 180,24 256,24 C332,24 442,45 490,120 C460,220 320,290 22,230 Z" 
        fill="url(#glossSheen)" 
        pointer-events="none"/>

  <!-- Targhetta Emblema WTO -->
  <g filter="url(#softShadow)">
    <rect x="156" y="442" width="200" height="42" rx="14" fill="#090d1a" stroke="url(#gold24k)" stroke-width="2.5"/>
    <text x="256" y="471" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="url(#goldLight)" text-anchor="middle" letter-spacing="7">WTO</text>
  </g>
</svg>
